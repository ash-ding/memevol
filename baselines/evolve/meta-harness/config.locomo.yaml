# =============================================================================
# meta-harness — full LoCoMo search run (10 iterations, search split).
#
#   cd baselines/evolve/meta-harness
#   uv run python run.py --config config.locomo.yaml --run-name locomo1
#
# Resume the same run with the same command plus --skip-baselines.
# Report the number with config.test.yaml (set dataset: locomo there first).
# =============================================================================

strict_config: true

# --- run ---------------------------------------------------------------------
status: search
dataset: locomo
run_name: null           # pass --run-name; candidates land in logs/<run>/harnesses/
iterations: 10           # paper runs 20 (text classification) / 40 (math retrieval)
n_candidates: 3          # ~30 candidates total, matching the paper's "roughly 60
                         # harnesses over 20 iterations"
baselines:
  - no_memory            # floor: no memory at all
  - full_context         # ceiling on cost: stuff the window, no selection
skip_baselines: false    # true when resuming — phase 0 is already recorded
finalize_systems: pareto # only read by --status test; listed so strict config passes

# --- proposer ----------------------------------------------------------------
agent: codex             # codex (`codex` CLI) | claude_code (`claude` CLI)
agent_model: gpt-5       # API-key auth reaches the full catalogue (verified:
                         # gpt-5, gpt-5.1, o3 all run). A ChatGPT-account login
                         # refuses all three — that restriction is the auth
                         # mode's, not the model's.
agent_effort: null       # null = paper setting per agent (claude max / codex high)
agent_auth: api_key      # bills OPENAI_API_KEY from .env. Codex reads creds from
                         # $CODEX_HOME, so the run stages its own at
                         # .codex_home/ and your `codex login` is left alone.
                         # Proposer spend lands in proposer_usage.jsonl only —
                         # common.tokens cannot see a CLI subprocess.
propose_timeout: 3600    # sessions ran 5-10 min in the smoke; history grows over
                         # 10 iterations, so this is headroom, not a target

# --- evaluation --------------------------------------------------------------
execution_model: gpt-5-mini   # QA agent answering from each harness's memory
judge_model: gpt-5-mini       # LLM-as-judge
max_sample_concurrent: 3      # conversations in flight within one candidate
max_eval_concurrent: 3        # candidates evaluated in parallel (= n_candidates,
                              # so an iteration's evals run as one wave)
eval_timeout: 14400           # 4h per candidate through the full gauntlet
max_logs: null                # dynamicmem-only knob; null on LoCoMo
progressive: false            # ONE pass sized by single_stage — no gauntlet, no
                              # promotion thresholds, no elimination. Every
                              # candidate is scored on the same task set, and
                              # no QA is answered twice (the staged path
                              # re-ran stage1's QAs inside stage2 and stage3).
                              # The pre-eval sanity gate still runs: it falls
                              # back to the family default, 1 conv x 3 QAs.
random_sample: false          # FIXED search set across iterations. The paper's
                              # setup: feedback comes from one search set, and a
                              # moving subset would make scores non-comparable
                              # between iterations, which the frontier relies on.
sampling_seed: 42
memory_cache: true            # no cross-stage reuse to do with one stage; left
                              # on so a resumed run can still reuse a snapshot

# --- sizing (LoCoMo family: n_conversations / n_qa) --------------------------
# ACTIVE block (progressive: false). 6 conversations is the WHOLE search split
# (LoCoMo splits 10 as search=first 6, test=last 4), so this is every
# conversation the search is allowed to see.
single_stage:
  n_conversations: 6          # the entire search split
  n_qa: 60                    # per conversation -> 360 QA evaluations per
                              # candidate. This is what stage3 used to run, so
                              # scores stay comparable with the staged runs.
                              # null = every QA instead (81-199 per conversation,
                              # ~885 total): ~2.5x the cost, every candidate,
                              # with no early elimination to absorb it.

stages: null                  # unused when progressive: false
