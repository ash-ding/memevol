# =============================================================================
# evolvemem (EvolveMem self-evolving retrieval configuration) baseline — exhaustive config.
#
# Two entry points share THIS file and this key set, so a theta can never be
# evolved under one set of assumptions and scored under another:
#
#   uv run python evolve.py --config config.example.yaml   # SEARCH: evolve a theta
#   uv run python run.py    --config config.example.yaml   # SCORE:  evaluate a theta
#
# EXACT CONFIG (always on): the YAML must list EVERY key below — and ONLY
# those keys (a null value counts as listed). A missing key OR an unknown key
# aborts the run, naming the problem. Validated by
# common.config.validate_exact_config (see config_schema.py).
#
# CLI surface is deliberately tiny — the two genuine runtime knobs an evolve
# baseline is allowed (baselines/README.md): evolve.py --max-rounds,
# run.py --theta. Everything else lives here.
# =============================================================================

dataset: locomo                # dynamicmem | locomo | longmemeval_s
split: search                  # evolve.py REQUIRES search. run.py accepts test
                               # ONLY for an authorized held-out number on a frozen theta.
progressive: false             # false = ONE single pass (sized by single_stage); true = staged gauntlet
sampling_seed: 42              # seeds the sampled subset (both paths; a no-op at whole-split)
memory_cache: true             # cross-stage Phase-1 memory reuse (gauntlet only)

# --- the search loop (evolve.py) --------------------------------------------
max_rounds: 7                  # the paper's setting (R_max=7). NOTE the round
                               # count: 7 here yields R0..R6 = 7 evaluations,
                               # which is also what upstream's own
                               # `run_benchmark.py --max-rounds 7` produces —
                               # the paper's Table 4 lists R0..R7 (8 rows), so
                               # its table and its code disagree by one.
                               # COST: each round re-answers EVERY QA in the
                               # split and then runs diagnosis, so cost scales
                               # with rounds x split size. With the sizing below
                               # (whole search split, 885 QA) this default run
                               # is ~7.1M gpt-4o tokens, ~$22, ~2h. Lower
                               # max_rounds / single_stage for a cheap probe.
initial_config: weak           # weak = BM25-only k=5, the paper's R0 and the honest
                               # analogue of forge starting from seeds/no_memory.
                               # strong = SimpleMem-level start (smaller search space).
convergence_threshold: 0.005   # stop when the primary metric improves less than this
evolve_llm_model: gpt-4o       # the paper's backbone. The loop's own LLM: extraction, diagnosis, meta-analysis,
                               # AND the answer generation the evolved theta prescribes.
                               # Routed through common.llm, so unlike the harness
                               # baselines these internal calls ARE counted in token_usage.json.
extraction_window_size: 40     # sliding-window turns per extraction call (upstream default)
extraction_overlap: 2          # window overlap in turns (upstream default)

# --- the artifact (memo.py) --------------------------------------------------
theta_path: null               # path to an evolved theta JSON (or an evolution_summary
                               # carrying final_config). null => score `initial_config`
                               # instead, which is how the paper's R0 baseline is reproduced.
                               # evolve.py writes memo_archive/<dataset>/<run>/theta.json.
embedding_model: BAAI/bge-base-en-v1.5   # the paper's embedder (768-dim; §4.1 Implementation).
                                    # Never loaded while the theta is keyword_only — the `weak`
                                    # start is BM25-only, so this is first touched when the loop
                                    # switches the semantic view on (upstream does that at R0->R1).
honor_answer_policy: true      # true  = the artifact answers under the theta's evolved answer
                               #         policy (answer_style / verification / answer_model).
                               #         This baseline is the ONLY one overriding the third hook —
                               #         see README.md for why that is the faithful choice.
                               # false = defer to the shared QA agent (the ablation). Retrieval
                               #         is identical either way, so the delta isolates answer policy.
                               # SET THIS TO false FOR dynamicmem. Upstream ships no dynamicmem
                               # answer adapter, so the theta falls back to a generic short-answer
                               # prompt that cannot satisfy DynamicMem's TCE structured-output
                               # contract: measured 0.0 (predicts the string "null") vs 0.167 with
                               # the shared agent. README.md § "Measured" has the details.
benchmark_adapter: null        # null => auto (locomo -> upstream's LoCoMoAdapter,
                               # longmemeval_s -> LongMemEvalAdapter, dynamicmem -> generic
                               # prompt, no upstream counterpart). Set explicitly to override.

# --- shared eval (baseline convention) --------------------------------------
llm_model: gpt-5-mini          # shared QA agent — used when honor_answer_policy is false
judge_model: gpt-5-mini        # LLM-as-judge scoring predicted vs reference
max_sample_concurrent: 3       # asyncio concurrency across users/samples

# --- Sizing (config-file only). BOTH keys must be present; the inactive one is
#     null. evolve.py reads single_stage to size the SEARCH split it evolves on. ---
single_stage:
  n_conversations: null        # locomo: null = every conversation in the search split (6).
  n_qa: null                   # locomo: null = all QA per conversation (cat 1-4; cat-5 excluded
                               # by this repo's protocol — see README "What we cannot match")
# For dynamicmem use {n_users, n_checkpoints, n_task_a, n_task_c};
# for longmemeval_s use {n_questions}. See baselines/README.md's sizing table.
stages: null
# stages:
#   sanity_check: {n_conversations: 1, n_qa: 3}
#   stage1: {n_conversations: 2, n_qa: 20, threshold: 0.30}
#   stage2: {n_conversations: 4, n_qa: 40, threshold: 0.35}
#   stage3: {n_conversations: 6, n_qa: 60}
