# =============================================================================
# zep (Zep / Graphiti temporal knowledge-graph memory) baseline — exhaustive
# config reference. Backend: embedded FalkorDB Lite (no server needed).
# Launch: cd baselines/harness/zep && uv run python run.py \
#             --config config.example.yaml
# This file is the ONLY parameter surface for run.py — it takes exactly one
# flag (--config). There are no CLI overrides and no built-in defaults.
#
# EXACT CONFIG (always on): the YAML must list EVERY key below — and ONLY
# those keys (a null value counts as listed). A missing key OR an unknown
# key aborts the run, naming the problem; sizing (single_stage/stages) is
# checked to the leaf. Validated by common.config.validate_exact_config.
# =============================================================================


dataset: locomo                 # which benchmark: dynamicmem | locomo | longmemeval_s (zep default: locomo)
split: test                    # test | search (search = the training split used during evolution)
progressive: false             # false = ONE single pass (sized by single_stage); true = staged stage1->2->3 gauntlet (sized by stages)
sampling_seed: 42              # seeds the sampled subset (both paths; a no-op at whole-split)
memory_cache: true             # cross-stage Phase-1 memory reuse (gauntlet only); --no-memory-cache to disable

# --- Zep / Graphiti retrieval + models ---
retrieve_k: 20                 # paper: top-20 edges (facts) + entity nodes (summaries) per query
embedder: bge-m3               # bge-m3 (paper-faithful, local sentence-transformers) | openai
embedder_model: BAAI/bge-m3     # embedding model (bge-m3: 1024-dim, paper's choice)
reranker: bge                  # bge (paper-faithful cross-encoder rerank) | openai
reranker_model: BAAI/bge-reranker-v2-m3   # graphiti's BGERerankerClient model
device: cuda                   # sentence-transformers device for BGE-m3 + reranker: cuda | cpu | null (auto). Use cpu on CPU-only boxes.
db_root: null                  # dir for the embedded FalkorDB Lite store; null => system temp (/tmp). MUST be a native POSIX FS
                               # (redislite binds a unix socket) — do NOT point at /mnt/c or another DrvFs/9p mount under WSL.
graph_llm_model: gpt-4o-mini    # Graphiti graph-construction LLM (paper: gpt-4o-mini-2024-07-18; keep a 4-series model)
graph_llm_small_model: null    # Graphiti "small" LLM for simpler prompts; null => same as graph_llm_model

# --- Shared eval knobs ---
llm_model: gpt-5-mini           # shared QA agent model (answers using the retrieved FACTS/ENTITIES context)
judge_model: gpt-5-mini        # LLM-as-judge model scoring predicted vs reference answers
max_sample_concurrent: 3       # asyncio concurrency across users/samples (each user = its own embedded FalkorDB Lite store)

# --- Sizing (config-file only; there is no other parameter surface). BOTH keys
#     must be present; the inactive one is null. Every leaf field in the active
#     block must be listed (a null leaf = whole split for that dimension). ---
# progressive: false → single_stage sizes the one pass (locomo native fields):
single_stage:
  n_conversations: null        # locomo: null = all conversations in the split; e.g. 2 to cap
  n_qa: null                   # null = all QA per conversation
# progressive: true → stages sizes the gauntlet (set single_stage: null above and
# fill this out; sizes must be non-decreasing across stage1..3):
stages: null
# stages:
#   sanity_check: {n_conversations: 1, n_qa: 3}
#   stage1: {n_conversations: 2, n_qa: 20, threshold: 0.30}
#   stage2: {n_conversations: 4, n_qa: 40, threshold: 0.35}
#   stage3: {n_conversations: 6, n_qa: 60}
