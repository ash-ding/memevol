# zep baseline — standalone uv project (Zep/Graphiti temporal KG memory (embedded FalkorDB Lite)).
#
#   cd baselines/harness/zep && uv sync      # -> .venv/ (CPython 3.12 via .python-version)
#
# Isolated per-baseline env (uv sync + committed uv.lock for reproducibility).
# The shared-core block is the closure common/ + datasets/ need — duplicated
# into every baseline pyproject on purpose (independence over DRY).
[project]
name = "memevol-baseline-zep"
version = "0.0.0"
description = "Zep/Graphiti temporal KG memory (embedded FalkorDB Lite)"
requires-python = ">=3.12"
dependencies = [
    # --- shared core (common/ + datasets/) ---
    "openai==1.107.3",
    "anthropic[vertex]",
    "python-dotenv",
    "httpx",
    "PyYAML",
    "jsonschema",
    "scipy",
    "numpy",
    "rich",
    "tiktoken",
    # --- zep-specific ---
    "neo4j>=5.26.0",          # graphiti_core driver (eager import)
    "tenacity>=9.0.0",        # graphiti_core retry
    "posthog>=3.0.0",         # graphiti_core telemetry
    "falkordblite>=0.5.0; python_version>='3.12'",   # embedded FalkorDB (provides falkordb+redislite)
    "redis<9",                # redis-py 8.x breaks falkordblite
    "python-dateutil",        # episode reference_time parsing
    "datasets",               # HF datasets — sentence-transformers imports it eagerly
    "pydantic",               # graphiti_core models
    "sentence-transformers>=3.2.1",   # BGE-m3 embedder + reranker
    "torch==2.6.0",                   # sentence-transformers backend; declared so [tool.uv.sources]
                                      # can pin its CUDA 12.4 build
]

[tool.uv]
package = false   # this dir is an app env, not a buildable package

# torch comes from PyTorch's CUDA 12.4 index, not PyPI: PyPI's Linux torch
# wheels now bundle CUDA 13, which needs NVIDIA driver >= 580. A CUDA 12.4 build
# runs on drivers >= 550 (e.g. penguin). 2.6.0 is the newest torch published for
# cu124. `explicit` keeps every other package on PyPI.
[tool.uv.sources]
torch = { index = "pytorch-cu124" }

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true
