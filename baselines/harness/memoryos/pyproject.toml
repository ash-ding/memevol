# memoryos baseline — standalone uv project (MemoryOS three-tier heat-based memory (vendored memoryos-pro)).
#
#   cd baselines/harness/memoryos && uv sync      # -> .venv/ (CPython 3.12 via .python-version)
#
# Isolated per-baseline env (uv sync + committed uv.lock for reproducibility).
# The shared-core block is the closure common/ + datasets/ need — duplicated
# into every baseline pyproject on purpose (independence over DRY).
[project]
name = "memevol-baseline-memoryos"
version = "0.0.0"
description = "MemoryOS three-tier heat-based memory (vendored memoryos-pro)"
requires-python = ">=3.12"
dependencies = [
    # --- shared core (common/ + datasets/) ---
    "openai==1.107.3",
    "anthropic[vertex]",
    "python-dotenv",
    "httpx",
    "PyYAML",
    "jsonschema",
    "scipy",
    "numpy",
    "rich",
    "tiktoken",
    # --- memoryos-specific ---
    "faiss-cpu",                   # mid_term.py / retriever.py: `import faiss`
    "sentence-transformers>=3.2.1",# utils.py: SentenceTransformer
    "transformers",                # ST backend
    "torch==2.6.0",                   # ST dep. Newest CUDA 12.4 build — see [tool.uv.sources]
    "datasets",                    # HF datasets — sentence-transformers imports it eagerly
]

[tool.uv]
package = false   # this dir is an app env, not a buildable package

# torch comes from PyTorch's CUDA 12.4 index, not PyPI: PyPI's Linux torch
# wheels now bundle CUDA 13, which needs NVIDIA driver >= 580. A CUDA 12.4 build
# runs on drivers >= 550 (e.g. penguin). 2.6.0 is the newest torch published for
# cu124. `explicit` keeps every other package on PyPI.
[tool.uv.sources]
torch = { index = "pytorch-cu124" }

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true
