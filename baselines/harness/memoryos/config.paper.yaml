# =============================================================================
# memoryos — the PAPER-REPRODUCTION run: the record of what produced the numbers in
# this baseline's README. Frame keys only; the method itself runs at its
# paper-faithful CONFIG_DEFAULTS (memo.py — print with `--describe memoryos`).
#
#   uv run --project baselines/harness/memoryos python -m baselines.harness.eval_harness #       --config baselines/harness/memoryos/config.paper.yaml
# =============================================================================

harness: memoryos
arm: faithful                  # the method's own published models

dataset: locomo                # the paper reports on LoCoMo
split: search
progressive: false
sampling_seed: 42

llm_model: gpt-4o-mini         # PAPER-ALIGNED answerer: the paper reports LoCoMo on gpt-4o-mini.
                               # The repo-comparable arm uses gpt-5-mini (config.example.yaml).
judge_model: gpt-5-mini        # LLM-as-judge model scoring predicted vs reference answers
max_sample_concurrent: 3

single_stage:
  n_conversations: null        # all 6 conversations in the search split
  n_qa: 60                     # 60 randomly-sampled QA per conversation = 360 total.
                               # 60 rather than 30 because open-domain is only 6% of LoCoMo:
                               # at 30 it lands ~10 questions, far too few to read.
stages: null
run_name: null
