# =============================================================================
# SMOKE: locomo (conversation branch) — 1 conversation, 3 QAs, search split.
# Launch: cd baselines/harness/simplemem && uv run python run.py \
#             --config smoke_locomo.yaml
#
# Cheapest end-to-end exercise of SimpleMem's locomo ingestion path. Everything
# except dataset/split/sizing matches config.example.yaml (the FAITHFUL arm) —
# see that file for what each key means and which paper section it comes from.
#
# EXACT CONFIG: every key below must be listed and no others. `strict_config`
# does NOT exist — completeness is unconditional (there is no DEFAULT_CONFIG to
# opt back into), so a smoke config is a FULL config, not a set of overrides.
#
# Needs: simplemem's own uv project and an OpenAI key. The faithful embedder
# (Qwen/Qwen3-Embedding-0.6B, ~0.6B params) downloads once from HuggingFace and
# benefits from a GPU; swap to all-MiniLM-L6-v2 for a lighter smoke run.
# =============================================================================


dataset: locomo
split: search                  # the training split — iterate here, not on test
progressive: false
sampling_seed: 42
memory_cache: true

# --- SimpleMem internal knobs (identical to config.example.yaml) -------------
simplemem_llm_model: gpt-4.1-mini
embedding_model: Qwen/Qwen3-Embedding-0.6B
base_url: null
window_size: 20                # the paper's W=20 (the vendored code ships 40)
overlap_size: 2
semantic_top_k: 25
keyword_top_k: 5
structured_top_k: 5
enable_planning: true
enable_reflection: true
max_reflection_rounds: 2
enable_parallel_processing: true
max_parallel_workers: 16
enable_parallel_retrieval: true
max_retrieval_workers: 8

# --- shared eval -------------------------------------------------------------
llm_model: gpt-5-mini
judge_model: gpt-5-mini
max_sample_concurrent: 3

# --- Sizing: the smoke slice -------------------------------------------------
single_stage:
  n_conversations: 1
  n_qa: 3
stages: null
