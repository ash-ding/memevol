# =============================================================================
# cc (Claude Code) baseline — exhaustive config reference.
# Launch: baselines/harness/cc/venv/bin/python baselines/harness/cc/run.py \
#             --config baselines/harness/cc/config.example.yaml
# CLI flags override any key here (precedence: DEFAULT_CONFIG < this file < CLI).
#
# STRICT-CONFIG (default on): with --config, EVERY key below must be present
# (a null value is allowed). Missing keys abort the run listing what's absent.
# Set strict_config: false (or pass --no-strict-config) to opt out.
# =============================================================================

strict_config: true            # require this file to list every parameter (default true)

dataset: dynamicmem            # which benchmark: dynamicmem | locomo | longmemeval_s | longmemeval_m
split: test                    # test | search (search = the training split used during evolution)
progressive: false             # false = ONE single pass (sized by single_stage); true = staged stage1->2->3 gauntlet (sized by stages)
sampling_seed: 42              # seeds the sampled subset (both paths; a no-op at whole-split)
memory_cache: true             # cross-stage Phase-1 memory reuse (gauntlet only); --no-memory-cache to disable
model: sonnet                  # CC model: sonnet | opus | claude-sonnet-4-20250514 | claude-opus-4-20250514
max_turns: 30                  # max tool-use turns CC may take per QA question
judge_model: gpt-5-mini        # LLM-as-judge model scoring predicted vs reference answers
max_sample_concurrent: 3       # asyncio concurrency across users/samples (higher = faster, more API load)

# --- Sizing (config-file only; no CLI flags). BOTH keys must be present; the
#     inactive one is null. Under strict mode the active block's leaves must all
#     be listed (a null leaf = whole split for that dimension). ---
# progressive: false → single_stage sizes the one pass:
single_stage:
  n_users: null                # dynamicmem: null = all users in the split; e.g. 2 to cap
  n_checkpoints: null          # null = all checkpoints per user
  n_task_a: null               # null = all Task A items per checkpoint
  n_task_c: null               # null = all Task C items per checkpoint
# progressive: true → stages sizes the gauntlet (set single_stage: null above and
# fill this out; sizes must be non-decreasing across stage1..3):
stages: null
# stages:
#   sanity_check: {n_users: 1, n_checkpoints: 1, n_task_a: 1, n_task_c: 1}
#   stage1: {n_users: 2, n_checkpoints: 1, n_task_a: 5, n_task_c: 5, threshold: 0.05}
#   stage2: {n_users: 4, n_checkpoints: 3, n_task_a: 5, n_task_c: 5, threshold: 0.10}
#   stage3: {n_users: 6, n_checkpoints: 5, n_task_a: 5, n_task_c: 5}
