# amem baseline — standalone uv project (A-mem agentic-notes memory).
#
#   cd baselines/harness/amem && uv sync      # -> .venv/ (CPython 3.12 via .python-version)
#
# Isolated per-baseline env (uv sync + committed uv.lock for reproducibility).
# The shared-core block is the closure common/ + datasets/ need — duplicated
# into every baseline pyproject on purpose (independence over DRY).
[project]
name = "memevol-baseline-amem"
version = "0.0.0"
description = "A-mem agentic-notes memory"
requires-python = ">=3.12"
dependencies = [
    # --- shared core (common/ + datasets/) ---
    "openai==1.107.3",
    "anthropic[vertex]",
    "python-dotenv",
    "httpx",
    "PyYAML",
    "jsonschema",
    "scipy",
    "numpy",
    "rich",
    "tiktoken",
    # --- amem-specific ---
    "sentence-transformers>=3.2.1",   # src/memory_layer.py: SentenceTransformer
    "transformers",                   # AutoModel/AutoTokenizer
    "torch==2.6.0",                   # embedding path. Newest CUDA 12.4 build — see [tool.uv.sources]
    "nltk",                           # word_tokenize
    "rank_bm25",                      # BM25Okapi
    "scikit-learn",                   # cosine_similarity
    "litellm",                        # completion
    "requests",
    "datasets",                       # HF datasets — sentence-transformers imports it eagerly
]

[tool.uv]
package = false   # this dir is an app env, not a buildable package

# torch comes from PyTorch's CUDA 12.4 index, not PyPI: PyPI's Linux torch
# wheels now bundle CUDA 13, which needs NVIDIA driver >= 580. A CUDA 12.4 build
# runs on drivers >= 550 (e.g. penguin). 2.6.0 is the newest torch published for
# cu124. `explicit` keeps every other package on PyPI.
[tool.uv.sources]
torch = { index = "pytorch-cu124" }

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true
