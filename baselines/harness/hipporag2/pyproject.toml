# hipporag2 baseline — standalone uv project (HippoRAG2 graph-RAG retrieval memory).
#
#   cd baselines/harness/hipporag2 && uv sync      # -> .venv/ (CPython 3.12 via .python-version)
#
# Isolated per-baseline env (uv sync + committed uv.lock for reproducibility).
# The shared-core block is the closure common/ + datasets/ need — duplicated
# into every baseline pyproject on purpose (independence over DRY).
[project]
name = "memevol-baseline-hipporag2"
version = "0.0.0"
description = "HippoRAG2 graph-RAG retrieval memory"
requires-python = ">=3.12"
dependencies = [
    # --- shared core (common/ + datasets/) ---
    "openai==1.107.3",
    "anthropic[vertex]",
    "python-dotenv",
    "httpx",
    "PyYAML",
    "jsonschema",
    "scipy",
    "numpy",
    "rich",
    "tiktoken",
    # --- hipporag2-specific ---
    # The `hipporag` package itself is VENDORED under src/ (byte-identical @
    # c617143 — see README.md), so it is NOT a dependency and there is no
    # editable install: `uv sync` alone is sufficient. What follows are the
    # runtime deps the vendored package actually imports, pinned as upstream's
    # own setup.py pins them.
    "torch==2.5.1",
    "transformers==4.45.2",
    "sentence-transformers>=3.2.1",   # embedding_model/Transformers.py (undeclared upstream)
    "gritlm==1.0.2",                  # embedding_model/GritLM.py — eagerly imported
    "litellm==1.73.1",                # llm/bedrock_llm.py — eagerly imported
    "python_igraph==0.11.8",          # HippoRAG.py personalized-PageRank
    "boto3",                          # llm/bedrock_mantle.py + embedding_model/Cohere.py (eager)
    "pandas",                         # embedding_store.py
    "pyarrow",                        # embedding_store.py parquet backend (the default)
    "pydantic==2.10.4",
    "tenacity==8.5.0",
    "tiktoken==0.7.0",
    "filelock",                       # llm/*.py + embedding_model/base.py caches
    "packaging",                      # llm/openai_gpt.py
    "requests",                       # embedding_model/VLLM.py
    "tqdm",
    # NOT included, deliberately:
    #   vllm, outlines — only llm/vllm_offline.py, llm/transformers_offline.py and
    #     information_extraction/openie_vllm_offline.py import them; none is on the
    #     import path of the OpenAI-backed config this baseline runs. vllm also
    #     hard-pins torch and is a multi-GB install.
    #   networkx, scipy, einops, nest_asyncio — declared by upstream's setup.py but
    #     imported nowhere in src/hipporag (they serve upstream's reproduce/ scripts).
    #     scipy/numpy/openai/httpx are already in the shared-core block above.
]

[tool.uv]
package = false   # this dir is an app env, not a buildable package
