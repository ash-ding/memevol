# HippoRAG2 baseline config. Launch:
#   baselines/venv/bin/python baselines/harness/hipporag2/run.py --config baselines/harness/hipporag2/config.example.yaml
# Any CLI flag overrides the matching key here (precedence: defaults < this file < CLI).
dataset: dynamicmem           # dynamicmem | locomo | longmemeval_s | longmemeval_m
split: test                   # test | search
progressive: false            # true = staged stage1->2->3 gauntlet; false = single pass
sampling_seed: 42             # seeds the sampled subset (honored by both paths; no-op at whole-split)

# --- Sizing lives here in the config file only (there are no sizing CLI flags) ---
# progressive: false REQUIRES `single_stage` — ONE pass sized by these fields.
# A null (or omitted) field = the WHOLE split for that dimension.
single_stage:
  n_users: null               # dynamicmem: null = all users in the split; e.g. 2 to cap
  n_checkpoints: null         # null = all checkpoints per user
  n_task_a: null              # null = all Task A items per checkpoint
  n_task_c: null              # null = all Task C items per checkpoint

# progressive: true alternative — the staged gauntlet (overrides family DEFAULT_STAGES):
# progressive: true
# stages:
#   sanity_check: {n_users: 1, n_checkpoints: 1, n_task_a: 1, n_task_c: 1}
#   stage1: {n_users: 2, n_checkpoints: 1, n_task_a: 5, n_task_c: 5, threshold: 0.05}
#   stage2: {n_users: 4, n_checkpoints: 3, n_task_a: 5, n_task_c: 5, threshold: 0.10}
#   stage3: {n_users: 6, n_checkpoints: 5, n_task_a: 5, n_task_c: 5}

memory_cache: true            # cross-stage Phase-1 memory reuse
embedding: text-embedding-3-small
llm_model: gpt-5-mini         # QA agent + HippoRAG internal LLM
judge_model: gpt-5-mini
# embedding_batch_size: 32     # optional (default: HippoRAG internal default)
# embedding_dtype: bfloat16    # optional (default: HippoRAG internal default)
max_sample_concurrent: 3
