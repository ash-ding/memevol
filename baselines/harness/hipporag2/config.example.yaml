# =============================================================================
# hipporag2 (HippoRAG2 retrieval memory) baseline — exhaustive config reference.
# Launch: cd baselines/harness/hipporag2 && uv run python run.py \
#             --config config.example.yaml
# This file is the ONLY parameter surface for run.py — it takes exactly one
# flag (--config). There are no CLI overrides and no built-in defaults.
#
# EXACT CONFIG (always on): the YAML must list EVERY key below — and ONLY
# those keys (a null value counts as listed). A missing key OR an unknown
# key aborts the run, naming the problem; sizing (single_stage/stages) is
# checked to the leaf. Validated by common.config.validate_exact_config.
# =============================================================================


dataset: dynamicmem            # which benchmark: dynamicmem | locomo | longmemeval_s
split: test                    # test | search (search = the training split used during evolution)
progressive: false             # false = ONE single pass (sized by single_stage); true = staged stage1->2->3 gauntlet (sized by stages)
sampling_seed: 42              # seeds the sampled subset (both paths; a no-op at whole-split)
memory_cache: rebuild          # cross-stage Phase-1 memory reuse. Values:
                               #   rebuild   DEFAULT — build Phase 1 fresh once per run, then let the
                               #             later gauntlet stages reuse that build. A run never inherits
                               #             memory from an earlier one, so every result is reproducible
                               #             from scratch; the build is still paid only ONCE per run
                               #   true      also reuse a snapshot from a PREVIOUS run — the cache is
                               #             results/<dataset>/<split>/memory_cache and is NOT
                               #             run-scoped, so a re-run skips the build entirely. Faster,
                               #             but what you measure is yesterday's memory
                               #   false     off entirely — every stage rebuilds
                               # Any change to this file's method knobs invalidates an entry (the sidecar
                               # fingerprints the memo config), so two different configs can never reuse
                               # each other's memory.
embedding: text-embedding-3-small   # OpenAI embedding model HippoRAG2 uses for its graph/vector index
llm_model: gpt-5-mini           # shared QA agent AND HippoRAG2's internal LLM (NER, triple extraction, etc.)
judge_model: gpt-5-mini        # LLM-as-judge model scoring predicted vs reference answers
embedding_batch_size: null      # batch size for embedding calls; null = HippoRAG2 internal default
embedding_dtype: null           # embedding tensor dtype (e.g. bfloat16); null = HippoRAG2 internal default
max_sample_concurrent: 3       # asyncio concurrency across users/samples (higher = faster, more API load)

# --- Sizing (config-file only; there is no other parameter surface). BOTH keys
#     must be present; the inactive one is null. Every leaf field in the active
#     block must be listed (a null leaf = whole split for that dimension). ---
# progressive: false → single_stage sizes the one pass:
single_stage:
  n_users: null                # dynamicmem: null = all users in the split; e.g. 2 to cap
  n_checkpoints: null          # null = all checkpoints per user
  n_task_a: null               # null = all Task A items per checkpoint
  n_task_c: null               # null = all Task C items per checkpoint
# progressive: true → stages sizes the gauntlet (set single_stage: null above and
# fill this out; sizes must be non-decreasing across stage1..3):
stages: null
# stages:
#   sanity_check: {n_users: 1, n_checkpoints: 1, n_task_a: 1, n_task_c: 1}
#   stage1: {n_users: 2, n_checkpoints: 1, n_task_a: 5, n_task_c: 5, threshold: 0.05}
#   stage2: {n_users: 4, n_checkpoints: 3, n_task_a: 5, n_task_c: 5, threshold: 0.10}
#   stage3: {n_users: 6, n_checkpoints: 5, n_task_a: 5, n_task_c: 5}
