# =============================================================================
# configs/test_example.yaml — held-out test config reference (forge.heldout).
#
# Evaluates SPECIFIC harnesses on the held-out TEST split, without the search
# loop's proposer / sanity gate / frontier. Launch:
#
#     venv/bin/python -m forge.heldout --config configs/test_example.yaml
#
# CLI flags override matching YAML fields; `--harness <dir>` (repeatable)
# REPLACES the `harnesses:` list below entirely. Fields you omit fall back to
# `forge/orchestrator.py::DEFAULT_CONFIG` — except `coverage`, which defaults
# to `full` in the heldout flow (final-numbers semantics) rather than the
# search loop's `sample`.
#
# Notes on semantics fixed by the heldout flow (not configurable here):
#   - the split is ALWAYS test (heldout has no mode/smoke_test concept)
#   - search-loop-only fields (steps, propose.*, proposer.*, sanity.*,
#     seed.*, selection.*, prompts.*) are ignored
# =============================================================================

# Per-run workspace dir → workspace/heldout_<run_name>/ (the heldout_ prefix
# is added automatically unless the name already starts with "heldout").
run_name: my_heldout

# -----------------------------------------------------------------------------
# WHAT to evaluate — harness directories (each must contain harness.py).
# Relative paths resolve against the CWD you launch from (use the project
# root). Sources are COPIED into this run's workspace and never modified;
# directory basenames must be distinct (they become the harness ids).
# -----------------------------------------------------------------------------
harnesses:
  - workspace/my_search_run/harnesses/3_9f00aa11
  - seeds/no_memory        # e.g. include the trivial baseline for reference

# -----------------------------------------------------------------------------
# HOW MUCH to evaluate.
#
# Held-out test evaluation is ALWAYS a full, uniform pass over the whole
# test split — that's the only way its numbers are valid as final results.
# `progressive` (the canonical knob, superseding `coverage` 2026-07-25) /
# the back-compat `coverage: sample` alias select the staged stage1→2→3
# gauntlet with threshold elimination — that's for the SEARCH loop, where
# bad candidates should die cheap. Applied to held-out test it would mean a
# harness eliminated at stage1 gets scored on a ~20-item subset instead of
# the full split, which is not a comparable held-out number. So
# `forge.heldout` REJECTS `progressive: true` / `coverage: sample` outright
# (SystemExit(2), before any harness runs) — see
# `forge/heldout.py::_reject_progressive_on_heldout`.
#
# The only valid setting here is full coverage: `coverage: full` (shown
# below) or, equivalently, `progressive: false`. Omitting both fields
# entirely also resolves to full (heldout's own default when neither is
# given anywhere).
#   full — ONE whole-test-split pass per benchmark: no stage1/2, no
#          threshold elimination; artifacts under <ds>/single/. Full
#          test-split sizes for cost planning: DynamicMem 4 users ×
#          ~400 items, LoCoMo 655 QA (cat 1-4), LongMemEval 200 questions.
# -----------------------------------------------------------------------------
coverage: full

# -----------------------------------------------------------------------------
# Benchmarks to evaluate on. Same schema as the search configs. Any per-
# benchmark `stages` block is IGNORED here — held-out evaluation is always
# full coverage (progressive=false / coverage=full is enforced above), so
# stage sizes/thresholds never apply; they only matter for the search loop's
# gauntlet (see forge/orchestrator.py::DEFAULT_STAGES).
#
# progressive=false REQUIRES a `single_stage` block per dataset (2026-07-26)
# — it's what sizes the ONE full pass (same size fields as a `stages` entry,
# no `threshold`); there is no more automatic whole-split fallback. Every
# field `null` (shown below) = whole test split for that dimension — the
# usual held-out setting. Omitting `single_stage` entirely now raises
# ValueError at eval time ("requires a `single_stage` block").
# -----------------------------------------------------------------------------
datasets:
  dynamicmem:
    judge_model: gpt-5.4-2026-03-05   # official TCE judge (downgrade to save cost)
    single_stage: {n_users: null, n_checkpoints: null, n_task_a: null, n_task_c: null}
  locomo:
    single_stage: {n_conversations: null, n_qa: null}
  longmemeval_s:
    single_stage: {n_questions: null}

# QA / retrieve agent model inside the harness eval. Provider-routed by name
# (gpt-*/o* → OpenAI; claude-* → Anthropic via the llm block below); optional
# "/effort" suffix pins reasoning effort.
model: gpt-5-mini/low

# Global judge fallback (per-dataset judge_model above wins).
judge_model: gpt-5-mini

# Anthropic transport for claude-* models (ignored for OpenAI models).
llm:
  anthropic_transport: api    # api | vertex
  vertex:
    project_id: itpc-gcp-ai-eng-claude
    region: us-east5
    credentials: null

# Parallel users/conversations per Singularity exec.
max_sample_concurrent: 3

# Reuse Phase-1 memory snapshots across stages (and across sample→full runs
# within this workspace). Recommended on.
memory_cache: true

gpu:
  enabled: false
