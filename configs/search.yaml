# Full multi-benchmark search.
# Usage:
#   python -m forge.orchestrator --config configs/search.yaml
steps: 10
mode: search
max_sample_concurrent: 3
memory_dumps: full        # full | stats | none — full dumps written per-user after Phase 1

model: gpt-5-mini/low   # "/low" pins reasoning effort — cuts generation latency (timeout-storm fix)
judge_model: gpt-5-mini
update_type: all_at_once

# Default proposer agent is claude_code; override with `agent: codex` here
# or `--agent codex` on CLI. Each agent has its own model + opts.
proposer:
  max_turns: 80
  timeout_s: 1500
  claude_code:
    model: claude-opus-4-7
    effort: medium                # low / medium / high / xhigh / max  (CC --effort)
    disallowed_tools: ["mcp__*"]
  codex:
    model: gpt-5.5
    reasoning_effort: medium      # low / medium / high  (codex -c model_reasoning_effort=...)

propose:
  k_per_step: 2             # candidates per outer-loop step (paper default)

selection:
  tau: 0.5                  # only used by Frontier.sample_parent (held-out test)

sanity:
  enabled: true
  max_retries: 2

# Staged evaluation: each harness runs the stage1→2→3 gauntlet per benchmark
# (independent promotion); the stage's normalized score must be >= threshold
# to advance. Sizes are per-unit (DynamicMem task counts per checkpoint;
# LoCoMo QA per conversation). Sampling is nested — a smaller stage's task
# set is a strict subset of a larger one. Omitted stage fields fall back to
# the family defaults in forge/orchestrator.py::DEFAULT_STAGES (identical to
# the values below). Thresholds are deliberately conservative — calibrate
# against stage-score distributions after the first real search run.
datasets:
  dynamicmem:
    judge_model: gpt-5.4-2026-03-05   # official TCE judge (downgrade to gpt-5-mini to save cost)
    stages:
      sanity_check: {n_users: 1, n_checkpoints: 1, n_task_a: 1, n_task_c: 1}
      stage1: {n_users: 2, n_checkpoints: 1, n_task_a: 5, n_task_c: 5, threshold: 0.05}
      stage2: {n_users: 4, n_checkpoints: 3, n_task_a: 5, n_task_c: 5, threshold: 0.10}
      stage3: {n_users: 6, n_checkpoints: 5, n_task_a: 5, n_task_c: 5}
  locomo:
    stages:
      sanity_check: {n_conversations: 1, n_qa: 3}
      stage1: {n_conversations: 2, n_qa: 20, threshold: 0.30}
      stage2: {n_conversations: 4, n_qa: 40, threshold: 0.35}
      stage3: {n_conversations: 6, n_qa: 60}
  longmemeval_s:
    stages:
      sanity_check: {n_questions: 2}
      stage1: {n_questions: 20, threshold: 0.25}
      stage2: {n_questions: 50, threshold: 0.30}
      stage3: {n_questions: 100}
  longmemeval_m:                      # heavy — ~476 sessions/question to ingest
    stages:
      sanity_check: {n_questions: 2}
      stage1: {n_questions: 20, threshold: 0.25}
      stage2: {n_questions: 50, threshold: 0.30}
      stage3: {n_questions: 100}
