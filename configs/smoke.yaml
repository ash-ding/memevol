# Minimal config for a quick end-to-end smoke test (<1 min on the host).
# Usage:
#   venv/bin/python -m forge.orchestrator --config configs/smoke.yaml
steps: 0                  # just evaluate the seed harness; no propose step
mode: dev                 # search split + sanity_check sizes + no gauntlet/sanity gate

# Smoke needs SOMETHING to evaluate (steps=0 + no seed = no work),
# so opt into the seed harness here. The default for normal runs is off.
seed:
  enabled: true
  source: no_memory

datasets:
  dynamicmem:
    # mode=dev runs one sanity_check-sized pass per benchmark (the staged
    # gauntlet is bypassed; stage1..3 blocks are ignored under dev).
    stages:
      sanity_check: {n_users: 1, n_checkpoints: 1, n_task_a: 1, n_task_c: 1}
