# =============================================================================
# configs/example.yaml — exhaustive forge config reference.
#
# Lists EVERY field that can be set via YAML, with its default value and a
# one-line note on what it does. Copy this file as a starting point and tune
# the fields you care about; everything you omit falls back to the default
# defined in `forge/orchestrator.py::DEFAULT_CONFIG`.
#
# CLI flags always override matching YAML fields (e.g. `--steps 5` wins over
# `steps: 1` here). The launch command is:
#
#     venv/bin/python -m forge.orchestrator --config configs/example.yaml
#
# CLI-only options (no YAML equivalent):
#   --config <path>      pick a YAML to start from
#   --verbose            DEBUG-level console + log output
# =============================================================================

# -----------------------------------------------------------------------------
# Top-level run settings
# -----------------------------------------------------------------------------

# Per-run workspace dir name → workspace/<run_name>/. If omitted at YAML AND
# CLI, defaults to a YYYYMMDD_HHMMSS timestamp resolved at startup.
run_name: my_first_search

# Outer-loop iterations. Each iteration runs `propose.k_per_step` candidate
# harnesses (so total proposals = steps * k_per_step). steps=0 means
# "evaluate the seed (if any) and exit" — useful for dry runs.
steps: 5

# search | test | dev — the ONE user-facing run-mode switch.
#   search — training/exploration phase. Reads the SEARCH (training) split
#            (e.g. DynamicMem users 001-006, LoCoMo conv-26..conv-44,
#            LongMemEval 300 stratified question_ids). Runs the full staged
#            gauntlet (stage1→2→3 with thresholds). Sanity layer respects
#            `sanity.enabled` (default on).
#   test   — held-out evaluation phase. Reads the TEST split. Full staged
#            gauntlet. Sanity respects `sanity.enabled`.
#   dev    — quick dev verification ("smoke / iterate"). Reads the SEARCH
#            split (never touches held-out test). Runs the whole pipeline
#            ONCE per benchmark at `stages.sanity_check` sizes — no gauntlet,
#            no thresholds, and the sanity gate is ALWAYS skipped (dev IS the
#            sanity-size quick check).
#            (Renamed from `status:`/`devtest` on 2026-07-07.)
mode: search

# OpenAI model used by the QA agent inside each harness eval (NOT the
# proposer — see `proposer.model`). Anything supported by OpenAI's
# /chat/completions endpoint works; gpt-5-mini / gpt-5 / gpt-4.1 / etc.
# An optional "/effort" suffix (low|medium|high) pins the reasoning effort
# for reasoning models — "gpt-5-mini/low" is strongly recommended: default
# (medium) effort was the main driver of historical LLM-timeout storms.
model: gpt-5-mini/low

# OpenAI model used by the LLM-as-judge that scores predicted vs reference
# answers per QA. Cheaper models are usually fine; gpt-5-mini is a sensible
# default that matches `model` for cost predictability.
judge_model: gpt-5-mini

# How Phase 1 chunks app_logs / sessions before calling general_update():
#   all_at_once — one call with everything (default; cheapest, most context)
#   chunked     — split into N equal chunks (uses an internal n_chunks=5)
#   sequential  — one update per item (most fine-grained, most calls)
update_type: all_at_once

# Asyncio semaphore cap for parallel users within one Singularity exec.
# Higher = faster eval but more concurrent OpenAI calls (rate limits) and
# more container memory. 3-6 is sane.
max_sample_concurrent: 3

# -----------------------------------------------------------------------------
# Proposer — runs OUTSIDE the eval container, in its own Singularity sandbox
# (proposer-base.sif). Two agent backends supported:
#   claude_code (default): host `claude` CLI, auth via subscription OAuth or
#                          long-lived setup-token (~/.claude/oauth_token).
#   codex                : host `codex` CLI (OpenAI Codex CLI), auth via
#                          OPENAI_API_KEY env var (from project .env).
# Switch backend with `agent: codex` here or `--agent codex` on CLI.
# -----------------------------------------------------------------------------

proposer:
  # Maximum agentic turns the proposer is allowed (caps Read/Bash/Write loops
  # in case the agent gets stuck). 80 leaves comfortable room for EXPLORATORY
  # runs that browse multiple priors + WebSearch + iterate on the harness.
  # Meta-Harness paper reports median 82 file-reads per iteration (Appendix
  # A.1). Tighten to ~50 only if propose calls consistently finish under budget.
  max_turns: 80

  # Wall-clock cap for ONE propose() call (in seconds). If hit, the orchestrator
  # logs TimeoutError and aborts (fail-fast). 1500s (25 min) ≈ 80 turns ×
  # ~20s/turn — sized to the max_turns budget.
  timeout_s: 1500

  # ----- claude_code agent-specific config -----
  claude_code:
    # Anthropic model id. opus-4-7 is the strongest available; sonnet variants
    # are cheaper but produce simpler harnesses.
    model: claude-opus-4-7

    # Reasoning effort: low / medium / high / xhigh / max. Higher = deeper
    # reasoning + slower + costlier. "medium" is the CC default.
    effort: medium

    # Tools blocked inside CC. Filesystem isolation is enforced by the
    # Singularity bind list, so this is only about CC's *behavioral* surface.
    #   ["mcp__*"]                       — default; only MCP wildcard.
    #   []                               — allow EVERYTHING (incl. MCP).
    #   ["Bash", "WebFetch", "WebSearch", "mcp__*"]  — paranoid sandbox.
    # CLI override: --proposer-disallowed-tools "Bash,WebFetch,mcp__*".
    disallowed_tools:
      - mcp__*

    # Credential route for the claude CLI. CLI override: --claude-auth <mode>.
    #   subscription — `claude login` OAuth; prefers the long-lived
    #                  ~/.claude/oauth_token (from `claude setup-token`),
    #                  falls back to a per-run copy of ~/.claude/.credentials.json.
    #   api_key      — ANTHROPIC_API_KEY from the host env or the project .env.
    #                  (CC's official precedence: an API key beats OAuth creds.)
    #   vertex       — Google Vertex AI via the `vertex:` block below.
    #                  (Cloud-provider flags have the HIGHEST precedence.)
    auth: subscription

    # Consumed only when auth: vertex. `model` above must then be a model
    # enabled in the GCP project (e.g. claude-opus-4-6; Vertex also accepts
    # @YYYYMMDD version pins). GCP credentials resolve in order: explicit
    # `credentials:` path → $GOOGLE_APPLICATION_CREDENTIALS →
    # ~/.config/gcloud/application_default_credentials.json (the file
    # `gcloud auth application-default login` writes).
    vertex:
      project_id: itpc-gcp-ai-eng-claude
      region: us-east5
      credentials: null

  # ----- codex agent-specific config -----
  codex:
    # OpenAI Codex model id. gpt-5.5 is current default.
    model: gpt-5.5

    # Reasoning effort: low / medium / high. "medium" is codex's default.
    reasoning_effort: medium

    # Note: codex has no "disallowed_tools" equivalent. Codex tool scope is
    # controlled by `--sandbox <mode>` which we hardcode to danger-full-access
    # (the real isolation is the outer Singularity bind list).

# -----------------------------------------------------------------------------
# How many candidate harnesses CC proposes per outer-loop step
# -----------------------------------------------------------------------------

propose:
  # k harnesses generated per outer-loop iteration. Default 2 follows the
  # Meta-Harness paper. Each is an independent CC SDK call; runs serially.
  # Total proposals per run = steps * k_per_step.
  k_per_step: 2

# -----------------------------------------------------------------------------
# Frontier selection (currently single-axis, see PROGRESS.md)
# -----------------------------------------------------------------------------

selection:
  # Softmax temperature for `Frontier.sample_parent` — only used by
  # held-out test top-K selection scripts (NOT by search_loop, which delegates
  # parent selection to the proposer agent per Meta-Harness paper).
  # Lower tau = greedier, higher tau = closer to uniform random.
  tau: 0.5

# -----------------------------------------------------------------------------
# Pre-eval sanity check (stages.sanity_check-sized run before the gauntlet)
# -----------------------------------------------------------------------------

sanity:
  # Run sanity before full eval when mode=eval. Disable to go straight to
  # full eval (faster but no early failure detection).
  enabled: true

  # Maximum propose_with_fix retries when sanity fails. Each retry asks CC
  # to Read+Edit its own harness based on the error trace. Default 2.
  # Set to 0 to disable retries (sanity_failed → frontier with score 0).
  max_retries: 2

# -----------------------------------------------------------------------------
# Optional seed harness (copied from seeds/<source>/ at startup)
# -----------------------------------------------------------------------------

seed:
  # Default off — CC writes the first harness from scratch with parent_ids=[].
  # Enable to give CC a known baseline to reference.
  enabled: false

  # Which subdir under top-level `seeds/` to copy as harnesses/0/ at startup.
  # Currently available: "no_memory" (Phase 1 no-op, Phase 2 returns {}).
  # Add new seeds by creating seeds/<name>/{harness.py, meta.json}.
  source: no_memory

# -----------------------------------------------------------------------------
# GPU support for the eval container (NOT the proposer)
# -----------------------------------------------------------------------------

gpu:
  # When true, prepends `--nv` to the evaluator's `singularity exec`,
  # bind-mounting host's NVIDIA driver libs (libcuda.so etc.) so the
  # container's torch+cu126 wheel can use GPUs visible at /dev/nvidia*.
  # Default off for portability — turning on couples runs to a host with
  # a compatible NVIDIA driver. Verified on this host with 4× L40S.
  enabled: false

# -----------------------------------------------------------------------------
# Pipeline toggles
# -----------------------------------------------------------------------------

# Cross-stage memory cache: persist each user's Phase-1 memory per
# (harness, dataset) under harnesses/<id>/<ds>/memory_cache/ and reuse it at
# deeper gauntlet stages (stage1..3 only; sanity/dev never touch it).
# CLI off-switch: --no-memory-cache.
memory_cache: true

# On resume, scan harnesses/ for dirs on disk that aren't in frontier.json
# (e.g. the orchestrator was killed mid-eval), classify them, and run only
# their missing pipeline stages. CLI off-switch: --no-adopt-orphans.
adopt_orphans: true

# Which coding-agent backend the proposer drives: "claude_code" (default;
# `claude` CLI in stream-json mode, subscription auth) or "codex" (OpenAI
# Codex CLI, requires OPENAI_API_KEY exported on the host).
agent: claude_code

# -----------------------------------------------------------------------------
# Prompt template version (forge/prompts/templates/)
# -----------------------------------------------------------------------------

prompts:
  # "latest" (or null/"") → read forge/prompts/templates/_default at startup;
  # the resolved stem is then PINNED for the whole run (config.yaml snapshot
  # records it). Pin an explicit stem, e.g. "20260518_2221_eba58319", to lock
  # a run for A/B comparisons. CLI: --prompts-version <stem>.
  version: latest

# -----------------------------------------------------------------------------
# Datasets (per-benchmark eval and sanity sizes)
#
# Each key under `datasets:` MUST match a workflow registered in
# `forge/launch.py::WORKFLOWS`. Currently available:
#   dynamicmem, locomo, longmemeval_s, longmemeval_m
#
# Comment out a benchmark to skip it; the entire datasets block is required
# (orchestrator errors out if no datasets configured).
# -----------------------------------------------------------------------------

# STAGED EVALUATION (since 2026-07-07): the old flat eval_n_*/check_n_*
# fields are GONE (they now raise a migration error). Each benchmark carries
# a `stages` block with four entries:
#
#   sanity_check  — crash gate before the gauntlet (mode=search/test only;
#                   also the size used by mode=dev runs). No threshold.
#   stage1/2/3    — the promotion gauntlet. After stage1/stage2, the stage's
#                   normalized score must be >= `threshold` to advance
#                   (per-benchmark independent). stage3 is terminal (no
#                   threshold; its score is the benchmark's final accuracy).
#
# Sizes use each benchmark's NATIVE hierarchy and are PER-UNIT; sampling is
# deterministic and NESTED (a smaller stage's task set is a strict subset of
# a larger one, so promotion comparisons are apples-to-apples).
# Any omitted stage/field falls back to the family defaults in
# forge/orchestrator.py::DEFAULT_STAGES (which equal the values shown here).
# Artifacts land in harnesses/<id>/<ds>/<stage>/, with the final reached
# stage's score.json copied to the dataset root + a stages.json summary.

datasets:

  dynamicmem:
    # Per-dataset judge override (falls back to the global judge_model).
    # gpt-5.4-2026-03-05 is the official TCE judge; downgrade to gpt-5-mini
    # to save cost at some fidelity loss. Scores are 0.0-1.0 (official
    # holistic Core+Detail: 0.8*core_correct + 0.2*detail_quality/2).
    judge_model: gpt-5.4-2026-03-05
    # Fields: n_users (of 6 search / 4 test), n_checkpoints (first k of 5),
    # n_task_a / n_task_c (items PER CHECKPOINT per family; each checkpoint
    # has ~17-53 of each). stage3 = 6u × 5cp × (5+5) = 300 items.
    stages:
      sanity_check: {n_users: 1, n_checkpoints: 1, n_task_a: 1, n_task_c: 1}
      stage1: {n_users: 2, n_checkpoints: 1, n_task_a: 5, n_task_c: 5, threshold: 0.05}
      stage2: {n_users: 4, n_checkpoints: 3, n_task_a: 5, n_task_c: 5, threshold: 0.10}
      stage3: {n_users: 6, n_checkpoints: 5, n_task_a: 5, n_task_c: 5}

  locomo:
    # Fields: n_conversations (of 6 search / 4 test), n_qa PER CONVERSATION
    # (each has ~105-260 QAs; sampled as a shuffled prefix — nested).
    # Thresholds are higher than DynamicMem: the no-memory floor is non-zero
    # (cat-5 adversarial "not mentioned" questions are free points).
    stages:
      sanity_check: {n_conversations: 1, n_qa: 3}
      stage1: {n_conversations: 2, n_qa: 20, threshold: 0.30}
      stage2: {n_conversations: 4, n_qa: 40, threshold: 0.35}
      stage3: {n_conversations: 6, n_qa: 60}

  longmemeval_s:
    # Single-level hierarchy: n_questions (of 300 search / 200 test; each
    # question is 1 QA + its own ~48-session haystack).
    stages:
      sanity_check: {n_questions: 2}
      stage1: {n_questions: 20, threshold: 0.25}
      stage2: {n_questions: 50, threshold: 0.30}
      stage3: {n_questions: 100}

  longmemeval_m:
    # Same 500 questions as _s but ~476-session haystacks (~1.3M tokens);
    # each Singularity exec reloads the 2.7 GB JSON (~30s overhead).
    stages:
      sanity_check: {n_questions: 2}
      stage1: {n_questions: 20, threshold: 0.25}
      stage2: {n_questions: 50, threshold: 0.30}
      stage3: {n_questions: 100}
