# Fast iteration: small per-benchmark coverage.
# Usage:
#   python -m forge.orchestrator --config configs/search_mini.yaml
steps: 3
mode: search
max_sample_concurrent: 3

model: gpt-5-mini/low   # "/low" pins reasoning effort — cuts generation latency (timeout-storm fix)
judge_model: gpt-5-mini
update_type: all_at_once

proposer:
  max_turns: 80
  timeout_s: 1500          # seconds
  claude_code:
    model: claude-opus-4-7
    effort: medium                # low / medium / high / xhigh / max  (CC --effort)
    disallowed_tools: ["mcp__*"]
  codex:
    model: gpt-5.5
    reasoning_effort: medium      # low / medium / high  (codex -c model_reasoning_effort=...)

propose:
  k_per_step: 2            # candidates per step

selection:
  tau: 0.5                 # only used for held-out test top-K

sanity:
  enabled: true
  max_retries: 2

# Mini staged gauntlet: same schema as search.yaml but smaller stage sizes
# for cheap iteration (omitted fields fall back to family defaults —
# forge/orchestrator.py::DEFAULT_STAGES).
datasets:
  dynamicmem:
    judge_model: gpt-5.4-2026-03-05   # official TCE judge (downgrade to gpt-5-mini to save cost)
    stages:
      sanity_check: {n_users: 1, n_checkpoints: 1, n_task_a: 1, n_task_c: 1}
      stage1: {n_users: 1, n_checkpoints: 1, n_task_a: 3, n_task_c: 3, threshold: 0.05}
      stage2: {n_users: 2, n_checkpoints: 2, n_task_a: 3, n_task_c: 3, threshold: 0.10}
      stage3: {n_users: 2, n_checkpoints: 3, n_task_a: 3, n_task_c: 3}
  locomo:
    stages:
      sanity_check: {n_conversations: 1, n_qa: 3}
      stage1: {n_conversations: 1, n_qa: 10, threshold: 0.30}
      stage2: {n_conversations: 2, n_qa: 10, threshold: 0.35}
      stage3: {n_conversations: 2, n_qa: 15}
  longmemeval_s:
    stages:
      sanity_check: {n_questions: 2}
      stage1: {n_questions: 5, threshold: 0.25}
      stage2: {n_questions: 8, threshold: 0.30}
      stage3: {n_questions: 10}
