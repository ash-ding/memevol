# Fast iteration: small per-benchmark coverage.
# Usage:
#   python -m forge.orchestrator --config configs/search_mini.yaml
steps: 3
status: search            # train/explore on search split (full eval size, sanity respected)
max_sample_concurrent: 3
memory_dumps: full        # full | stats | none

model: gpt-5-mini/low   # "/low" pins reasoning effort — cuts generation latency (timeout-storm fix)
judge_model: gpt-5-mini
update_type: all_at_once

proposer:
  max_turns: 80
  timeout_s: 1500          # seconds
  claude_code:
    model: claude-opus-4-7
    effort: medium                # low / medium / high / xhigh / max  (CC --effort)
    disallowed_tools: ["mcp__*"]
  codex:
    model: gpt-5.5
    reasoning_effort: medium      # low / medium / high  (codex -c model_reasoning_effort=...)

propose:
  k_per_step: 2            # candidates per step

selection:
  tau: 0.5                 # only used for held-out test top-K

sanity:
  enabled: true
  max_retries: 2

datasets:
  dynamicmem:
    eval_n_samples: 2
    eval_n_qa: 10           # per-user TCE items, stratified across checkpoints × task families
    judge_model: gpt-5.4-2026-03-05   # official TCE judge (downgrade to gpt-5-mini to save cost)
    # check_n_samples / check_n_qa default to 1 / 3
  locomo:
    eval_n_samples: 2
    eval_n_qa: 10
  longmemeval_s:
    eval_n_samples: 10
    # eval_n_qa & check_n_qa ignored — LongMemEval has exactly 1 QA per sample
